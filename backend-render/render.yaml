services:
  - type: web
    name: bigplay-players-club-api
    runtime: node
    plan: free
    rootDir: backend-render
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GHL_API_KEY
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
      - key: EMPLOYEE_PIN
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://bigplay-players-club.onrender.com
      - key: GHL_FIELD_MEMBERSHIP_ID
        value: membership_id
      - key: GHL_FIELD_MEMBERSHIP_STATUS
        value: membership_status
      - key: GHL_FIELD_PROMOTION
        value: active_promotion
      - key: GHL_FIELD_REWARD
        value: active_reward
      - key: GHL_FIELD_REDEMPTION_STATUS
        value: redemption_status
      - key: GHL_FIELD_REDEEMED_AT
        value: redeemed_at
      # Optional audit column — uncomment after creating the custom field in GHL:
      # - key: GHL_FIELD_REDEEMED_BY
      #   value: redeemed_by
